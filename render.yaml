databases:
  - name: herbcare-db
    databaseName: herbcare
    user: herbcare_user

services:
  - type: web
    name: herbcare-app
    env: php
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:bcB9icqce16ZATl0OVkxSwIAldJcbfWGnk1qjHFtjUQ=
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: herbcare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: herbcare-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: herbcare-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: herbcare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: herbcare-db
          property: password
